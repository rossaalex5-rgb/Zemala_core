<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zemala Core</title>
    <style>
        /* Verhindert die weiße Fläche komplett */
        html, body {
            background-color: #0b0f14 !important;
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            color: #e6e6e6;
            font-family: sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 28px; }
        p { color: #8b949e; }
        .card {
            background: #121821;
            border: 1px solid #1f2a35;
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 { font-size: 20px; margin-top: 0; color: #58a6ff; }
        textarea {
            width: 100%;
            height: 100px;
            background: #0b0f14;
            color: #39ff14; /* Matrix-Grün für den Text */
            border: 1px solid #1f2a35;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            font-family: monospace;
        }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        pre {
            background: #000;
            color: #39ff14;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1f2a35;
            min-height: 40px;
            word-break: break-all;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <header>
        <h1>Zemala Core</h1>
        <p>Ereignis → Hash → Exportsystem</p>
    </header>

    <div class="card">
        <h2>Eingang</h2>
        <textarea id="input">{"message":"Zemala System stabil"}</textarea>
        <button onclick="runHash()">Generieren + Exportieren</button>
    </div>

    <div class="card">
        <h2>Ausgabe-Hash</h2>
        <pre id="output">Noch kein Hash generiert...</pre>
    </div>

    <script>
        async function runHash() {
            const text = document.getElementById('input').value;
            if(!text) return;
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            document.getElementById('output').textContent = hashHex;
            document.getElementById('output').style.color = "#39ff14";
        }
    </script>
</body>
</html>
